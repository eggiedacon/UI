 <div data-for="mnt sold bal" ${sold?'':'hidden'}><div class="card" style="background:var(--soft);margin:6px 0 10px"><label class="tgl"><input type="checkbox" name="mfon" ${s.mf.on?'checked':''} onchange="mfUp('${id}')">Monthly maintenance fee applies</label><label>Monthly maintenance fee (₱)</label><input class="inp" name="mfamt" type="number" min="0" step="0.01" value="${s.mf.amt||''}" oninput="mfUp('${id}')"><button type="button" class="btn o k w" style="margin-top:0" onclick="mfPay('${id}')">+ Record maintenance payment</button><p class="sm" style="margin-top:8px">Marks the oldest unpaid month of ${YR}. Reminders are sent from the maintenance map below.</p></div></div>
 <div data-for="bal" ${s.st==='bal'?'':'hidden'}><label>Months paid so far (of 24)</label><div class="row" style="flex-wrap:nowrap;margin-bottom:10px"><input class="inp" name="pm" type="number" min="0" max="24" value="${s.pm||0}" oninput="payUp('${id}')" style="margin:0"><button type="button" class="btn o k" style="white-space:nowrap" onclick="payAdd('${id}')">+ Payment</button></div></div>
 <label>Notes / remarks</label><textarea class="inp" name="o">${s.note||''}</textarea></fieldset>${fbtns(`encS('${id}')`,`recSave(null,'${id}',1)`)}</form>
 <h2>Pricing &amp; payments</h2><div id="pcard">${priceCard(s.cls)}</div><div data-for="bal" ${s.st==='bal'?'':'hidden'}><div id="pay">${payHtml(id,s.pm,s.cls)}</div></div><div data-for="mnt sold bal" ${sold?'':'hidden'}><div id="mfmap">${mfHtml(id,s.mf.amt,s.mf.on)}</div></div>`}
function recSave(e,id,dr){if(e)e.preventDefault();const f=new FormData($('#cf')),s=sp(id);if(!dr)s.st=f.get('st');s.draft=!!dr;s.cls=f.get('cls');s.b=f.get('b');s.tel=f.get('t');s.mail=f.get('m');s.ref=f.get('r');s.note=f.get('o');s.pm=Math.max(0,Math.min(24,+f.get('pm')||0));s.mf.on=!!f.get('mfon');s.mf.amt=+f.get('mfamt')||0;closeRec();T(dr?'Draft saved. Status unchanged until you press Save.':'Lot '+id.slice(5)+' updated')}
function slSave(e,id,i,dr){if(e)e.preventDefault();const f=new FormData($('#sf'+i)),s=sp(id),n=(f.get('n')||'').trim();if(!n)return T('Enter the deceased name first.');
 const o={n,dt:f.get('d'),c:f.get('c'),t:f.get('t'),e:f.get('e'),pm:f.get('pm')===null?(s.int[i]&&s.int[i].pm):Math.max(0,Math.min(24,+f.get('pm')||0)),draft:!!dr};if(i<s.int.length)s.int[i]=o;else s.int.push(o);s.st='occ';closeRec();T(dr?'Draft saved':'Slot saved')}
function encS(id){if(sp(id).int.length>=CAP)return T('All '+CAP+' slots are used.');sheet(`<h2 style="margin-top:0">Encode deceased · Lot ${id.slice(5)}</h2><form onsubmit="encSave(event,'${id}')"><label>Deceased legal name</label><input class="inp" name="n" required><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Birth year</label><input class="inp" name="b" type="number" required></div><div style="flex:1"><label>Year of passing</label><input class="inp" name="d" type="number" required></div></div><label>Client / heir name</label><input class="inp" name="c" required><label>Client contact number</label><input class="inp" name="p" type="tel" required><label class="tgl"><input type="checkbox" name="v" checked>Public obituary</label><button class="btn w">Save record</button><button type="button" class="btn o k w" onclick="closeS()">Cancel</button></form>`)}
function encSave(e,id){e.preventDefault();const f=new FormData(e.target),s=sp(id);S.d.unshift({id:'D-'+String(100+S.d.length).padStart(4,'0'),n:f.get('n'),b:+f.get('b'),d:+f.get('d'),l:'Phase '+id.slice(5,6)+', Lot '+id.slice(5),c:f.get('c'),v:f.get('v')?'Public':'Unlisted',r:365,bio:''});s.int.push({n:f.get('n'),c:f.get('c'),t:f.get('p'),e:'',dt:new Date().toISOString().slice(0,10)});s.st='occ';closeS();closeRec();T('Deceased record saved')}
/* deceased edit + photo manager */
let PHW={list:[]};
function decEdit(){const x=D(S.dec),lk=S.lk?'disabled':'';
 return `<p class="up">${x.id}</p><h1>${x.n}</h1><form class="card" style="margin-top:14px" onsubmit="decSave(event,'${x.id}')"><fieldset class="lk" ${lk}>${fl('Deceased legal name','n',x.n)}${fl('Client contact','c',x.c)}<div class="row" style="flex-wrap:nowrap"><div style="flex:1">${fl('Birth year','b',x.b,'number')}</div><div style="flex:1">${fl('Year of passing','d',x.d,'number')}</div></div>${fl('Location','l',x.l)}<label>Visibility</label><select class="inp" name="v">${['Public','Unlisted','Draft'].map(o=>`<option ${x.v===o?'selected':''}>${o}</option>`).join('')}</select><label>Memorial photos</label><label class="dz"><input type="file" accept="image/*" multiple onchange="phAdd(this.files);this.value=''"><b>Tap to add photos</b><br><span class="sm">JPG/PNG · up to 5 MB each · max 12 · first photo is the cover</span></label><div class="sp" style="margin-top:10px"><span class="sm" id="phCnt"></span><button type="button" id="phClr" class="sm" style="text-decoration:underline;color:#B91C1C" onclick="phClear()">Remove all</button></div><div id="phGrid" class="tg"></div><label>Obituary / life story</label><textarea class="inp" name="bio">${x.bio||''}</textarea></fieldset><div class="fb"><button class="btn lkb" ${S.lk?'disabled':''}>Save changes</button><button type="button" class="btn o k" onclick="closeRec()">Cancel</button></div></form>`}
function phDraw(){const g=$('#phGrid');if(!g)return;g.innerHTML=PHW.list.map((u,i)=>`<div class="th"><img src="${u}" alt="Memorial photo ${i+1}">${i?'':'<span class="cv">Cover</span>'}<button type="button" onclick="phDel(${i})" aria-label="Remove photo ${i+1}">✕ Remove</button></div>`).join('');$('#phCnt').textContent=PHW.list.length?PHW.list.length+' photo'+(PHW.list.length>1?'s':''):'No photos yet';$('#phClr').hidden=!PHW.list.length}
function phAdd(files){if(S.lk)return T('Tap Edit first to change photos.');[...files].forEach(f=>{if(!/^image\//.test(f.type))return T(f.name+' is not an image.');if(f.size>5e6)return T(f.name+' is over 5 MB.');if(PHW.list.length>=12)return T('Maximum of 12 photos.');const r=new FileReader();r.onload=()=>{PHW.list.push(r.result);phDraw()};r.readAsDataURL(f)})}
const phDel=i=>{PHW.list.splice(i,1);phDraw()},phClear=()=>{if(PHW.list.length&&confirm('Remove all photos from this record?')){PHW.list=[];phDraw()}};
function decSave(e,id){e.preventDefault();const f=new FormData(e.target),x=D(id),n=(f.get('n')||'').trim();if(!n)return T('Legal name is required.');Object.assign(x,{n,c:f.get('c'),b:+f.get('b')||x.b,d:+f.get('d')||x.d,l:f.get('l'),v:f.get('v'),bio:f.get('bio'),photos:[...PHW.list]});closeRec();T('Record updated')}
function mod(id,st){S.com.find(c=>c.id===id).st=st;R();T('Tribute '+st.toLowerCase())}
function inqS(id){const i=S.inq.find(x=>x.id===id);if(i.st==='Unread')i.st='Opened';R();sheet(`<h2 style="margin-top:0">${i.s} inquiry</h2><p class="sm">${i.n}, ${i.dt}</p><p class="card" style="margin:12px 0">${i.m}</p>${i.r?`<p><b>Reply sent:</b> ${i.r}</p><button class="btn w" onclick="closeS()">Close</button>`:`<form onsubmit="event.preventDefault();i2(${id},this.elements.r.value)"><label>Your reply</label><textarea name="r" class="inp" required placeholder="Draft institutional response"></textarea><button class="btn w">Send reply</button></form>`}`)}
function i2(id,r){const i=S.inq.find(x=>x.id===id);i.r=r;i.st='Replied';closeS();R();T('Reply sent by corporate email')}
function memorial(){const x=D(S.o),cs=S.com.filter(c=>c.did===x.id&&c.st==='Approved');return `<div class="mh">${x.photos&&x.photos.length?`<img class="av big" style="object-fit:cover;margin:0 auto" src="${x.photos[0]}" alt="">`:av(x.n,'big')}<h1>${x.n}</h1><p class="body">${x.b} – ${x.d}</p><p class="sm">Verified location: ${x.l}</p></div><h2>Life story</h2><p class="body">${x.bio||'No biography provided.'}</p>${x.photos&&x.photos.length?`<h2>Photos</h2><div class="gal">${x.photos.map(u=>`<img src="${u}" alt="Memorial photo of ${x.n}">`).join('')}</div>`:''}<h2>Light a candle</h2><div class="card cd"><button class="btn fl" id="fb" onclick="lit()">${ic('fl')} Light a candle</button><p><b id="cn">${S.cd[x.id]||0}</b> candles lit</p></div><h2>Guestbook</h2>${cs.map(c=>`<div class="card"><b>${c.au}</b><p class="body">${c.msg}</p></div>`).join('')||'<p class="empty">No tributes yet. Be the first to leave one.</p>'}<form class="card" onsubmit="trib(event)"><input class="inp" name="n" placeholder="Your name" autocomplete="name"><label class="chk"><input type="checkbox" name="a">Post as anonymous</label><textarea class="inp" name="m" required placeholder="Message / Mensahe (English or Tagalog)"></textarea><button class="btn w">Post tribute</button><p class="sm" style="margin-top:8px">Written tributes appear once park administrators review them.</p></form>`}
function lit(){S.cd[S.o]=(S.cd[S.o]||0)+1;$('#cn').textContent=S.cd[S.o];const b=$('#fb');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');T('Your candle is lit.')}
function trib(e){e.preventDefault();const f=e.target.elements;S.com.unshift({id:104+S.com.length,did:S.o,au:f.a.checked?'Anonymous':f.n.value||'Guest',msg:f.m.value,candle:0,ts:'Just now',st:'Pending'});R();T('Tribute submitted for review.')}
for(let p=1;p<=4;p++)for(let i=1;i<=48;i++)sp('lawn-'+(p*100+i));
R();
</script></body></html>
